apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: cv-lab
  labels:
    app: mlflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        # One init step does all one-shot setup, idempotently:
        #   1. install the Postgres (psycopg 3) / S3 drivers into a shared volume (no custom image)
        #   2. create the `mlflow` bucket in SeaweedFS if missing
        #   3. migrate the DB schema (no-op on a fresh DB; mlflow server creates it)
        - name: setup
          image: ghcr.io/mlflow/mlflow:v3.17.0
          command:
            - bash
            - -ec
            - |
              pip install --quiet --target /deps 'psycopg[binary]' boto3
              export PYTHONPATH=/deps
              python - <<'PY'
              import os, boto3, botocore
              s3 = boto3.client(
                  "s3",
                  endpoint_url=os.environ["MLFLOW_S3_ENDPOINT_URL"],
                  config=botocore.config.Config(s3={"addressing_style": "path"}),
              )
              try:
                  s3.head_bucket(Bucket="mlflow")
                  print("bucket mlflow exists")
              except botocore.exceptions.ClientError:
                  s3.create_bucket(Bucket="mlflow")
                  print("bucket mlflow created")
              PY
              mlflow db upgrade "$BACKEND_STORE_URI"
          envFrom:
            - secretRef:
                name: seaweedfs-s3-credentials
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_PASSWORD}}
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_DB}}
            - name: BACKEND_STORE_URI
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - name: MLFLOW_S3_ENDPOINT_URL
              value: http://seaweedfs.kubeflow:8333
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: MLFLOW_S3_IGNORE_TLS
              value: "true"
            - name: PYTHONPATH
              value: /deps
          volumeMounts:
            - name: deps
              mountPath: /deps
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.17.0
          command:
            - mlflow
            - server
            - --host=0.0.0.0
            - --port=5000
            - --allowed-hosts=*
            - --backend-store-uri=$(BACKEND_STORE_URI)
            - --serve-artifacts
            - --artifacts-destination=s3://mlflow
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - secretRef:
                name: seaweedfs-s3-credentials
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_PASSWORD}}
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_DB}}
            - name: BACKEND_STORE_URI
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - name: MLFLOW_S3_ENDPOINT_URL
              value: http://seaweedfs.kubeflow:8333
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: MLFLOW_S3_IGNORE_TLS
              value: "true"
            - name: PYTHONPATH
              value: /deps
          volumeMounts:
            - name: deps
              mountPath: /deps
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1536Mi
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
            failureThreshold: 4
      volumes:
        - name: deps
          emptyDir: {}
