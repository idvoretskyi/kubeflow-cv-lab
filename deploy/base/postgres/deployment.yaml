apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: cv-lab
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO volume: the old pod must release it first
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      # CPU-only; may use spare capacity on the GPU node of the 2-node
      # reference cluster. Never requests a GPU.
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            # Postgres 18 images keep data in /var/lib/postgresql/<major>/docker
            - name: data
              mountPath: /var/lib/postgresql
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-pvc
