# Normally created by `make bootstrap` with a random password. Manual path:
#   cp deploy/base/postgres/secret.example.yaml deploy/base/postgres/secret.yaml  # git-ignored
#   kubectl apply -f deploy/base/postgres/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: cv-lab
type: Opaque
stringData:
  POSTGRES_USER: mlflow
  POSTGRES_PASSWORD: change-me
  POSTGRES_DB: mlflow
