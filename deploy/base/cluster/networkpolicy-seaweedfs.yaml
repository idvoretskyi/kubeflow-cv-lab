# Allow cv-lab pods (MLflow) to reach SeaweedFS S3 on port 8333.
# This is the only additive change made to the upstream `kubeflow` namespace.
# Selector matches the upstream SeaweedFS pod label (`app: seaweedfs`).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cv-lab-to-seaweedfs
  namespace: kubeflow
spec:
  podSelector:
    matchLabels:
      app: seaweedfs
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cv-lab
      ports:
        - port: 8333
          protocol: TCP
