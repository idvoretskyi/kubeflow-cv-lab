apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Cluster-level additive NetworkPolicy (applies to kubeflow namespace)
  - cluster/networkpolicy-seaweedfs.yaml

  # Postgres backend store for MLflow
  - postgres/pvc.yaml
  - postgres/deployment.yaml
  - postgres/service.yaml

  # MLflow tracking + artifact server
  - mlflow/deployment.yaml
  - mlflow/service.yaml
