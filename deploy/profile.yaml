# Kubeflow Profile -> creates the cv-lab namespace with Kubeflow RBAC.
# `make bootstrap` applies this with the owner replaced by $KF_PROFILE_OWNER
# (default: the Dex demo user user@example.com).
apiVersion: kubeflow.org/v1
kind: Profile
metadata:
  name: cv-lab
spec:
  owner:
    kind: User
    name: user@example.com
