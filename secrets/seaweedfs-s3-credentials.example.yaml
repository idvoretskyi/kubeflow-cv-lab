apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3-credentials
  namespace: cv-lab
type: Opaque
stringData:
  # Replace with your cluster's SeaweedFS object-store S3 credentials.
  # On Kubeflow 26.03 the credentials are stored in the kubeflow namespace secret
  # `mlpipeline-minio-artifact` (keys: accesskey / secretkey).
  AWS_ACCESS_KEY_ID: minio
  AWS_SECRET_ACCESS_KEY: minio123
