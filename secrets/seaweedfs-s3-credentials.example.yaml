# Normally created by `make bootstrap`, which copies the keys from the upstream
# Kubeflow Secret kubeflow/mlpipeline-minio-artifact (accesskey / secretkey).
# Manual path (file is git-ignored once copied):
#   cp secrets/seaweedfs-s3-credentials.example.yaml secrets/seaweedfs-s3-credentials.yaml
#   kubectl apply -f secrets/seaweedfs-s3-credentials.yaml
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3-credentials
  namespace: cv-lab
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: <seaweedfs-access-key>
  AWS_SECRET_ACCESS_KEY: <seaweedfs-secret-key>
