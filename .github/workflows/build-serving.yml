name: Build serving image

on:
  push:
    branches: [main]
    paths:
      - "images/serving/**"
      - ".github/workflows/build-serving.yml"
  pull_request:
    branches: [main]
    paths:
      - "images/serving/**"
      - ".github/workflows/build-serving.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build (and push on main) ghcr.io/idvoretskyi/kubeflow-cv-lab-serving
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (push only from main)
        uses: docker/build-push-action@v7
        with:
          context: images/serving
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/idvoretskyi/kubeflow-cv-lab-serving:latest
            ghcr.io/idvoretskyi/kubeflow-cv-lab-serving:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
