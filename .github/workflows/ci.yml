name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.10"
          args: check

  shellcheck:
    name: Shell lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run shellcheck (POSIX sh)
        run: shellcheck -s sh platform/*.sh deploy/*.sh

  yamllint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yaml

  kubeconform:
    name: Manifest validation (kustomize + kubeconform)
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.7.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install kubeconform
        run: |
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -sSLfO "${base}/kubeconform-linux-amd64.tar.gz"
          curl -sSLfO "${base}/CHECKSUMS"
          grep ' kubeconform-linux-amd64.tar.gz$' CHECKSUMS | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform

      - name: Build and validate kustomizations
        run: |
          set -euo pipefail
          for k in deploy deploy/overlays/lke serving; do
            echo "::group::${k}"
            kubectl kustomize "${k}" | ./kubeconform -strict -summary \
              -schema-location default \
              -schema-location \
              'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -
            echo "::endgroup::"
          done
          # No published schema for TrainJob; everything else must validate.
          ./kubeconform -strict -summary -skip TrainJob \
            -schema-location default \
            -schema-location \
            'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            deploy/profile.yaml examples/pytorch-training/pytorch-mnist-gpu.yaml

  tofu:
    name: OpenTofu validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: fmt + validate
        working-directory: tofu
        run: |
          tofu fmt -check -recursive
          tofu init -backend=false -input=false
          tofu validate

  kfp-compile:
    name: KFP compile drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pinned KFP SDK
        run: pip install -r pipeline/requirements.txt

      - name: Compile all pipelines and check for drift
        run: |
          python pipeline/pipeline.py
          python examples/kubeflow-pipelines/hello_pipeline.py
          python examples/kubeflow-pipelines/gpu_pipeline.py
          if [ -n "$(git status --porcelain -- pipeline/pipeline.yaml examples/kubeflow-pipelines)" ]; then
            git diff -- pipeline/pipeline.yaml examples/kubeflow-pipelines
            echo "::error::Compiled pipeline YAML is out of date. Run 'make compile examples-compile' and commit the result."
            exit 1
          fi

      - name: Check MLflow pin parity
        run: |
          v=$(python -c "import sys; sys.path.insert(0, 'pipeline'); from versions import MLFLOW_VERSION; print(MLFLOW_VERSION)")
          grep -q "mlflow-skinny==${v}\$" images/serving/requirements.txt || { echo "::error::images/serving/requirements.txt is not mlflow-skinny==${v}"; exit 1; }
          n=$(grep -c "ghcr.io/mlflow/mlflow:v${v}\$" deploy/base/mlflow/deployment.yaml)
          [ "$n" -eq 2 ] || { echo "::error::deploy/base/mlflow/deployment.yaml must use ghcr.io/mlflow/mlflow:v${v} in both containers (found $n)"; exit 1; }

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: |
            **/*.md
