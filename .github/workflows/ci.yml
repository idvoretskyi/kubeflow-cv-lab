name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run ruff
        uses: astral-sh/ruff-action@v4
        with:
          version: "0.16.10"
          args: check

  shellcheck:
    name: Shell lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run shellcheck (POSIX sh)
        run: shellcheck -s sh platform/*.sh deploy/*.sh

  yamllint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yaml

  kubeconform:
    name: Manifest validation (kustomize + kubeconform)
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.7.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install kubeconform
        run: |
          curl -sSLf \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz kubeconform

      - name: Build and validate kustomizations
        run: |
          set -eu
          for k in deploy deploy/overlays/lke serving; do
            echo "::group::${k}"
            kubectl kustomize "${k}" | ./kubeconform -strict -summary \
              -ignore-missing-schemas \
              -schema-location default \
              -schema-location \
              'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -
            echo "::endgroup::"
          done
          ./kubeconform -strict -summary -ignore-missing-schemas \
            deploy/profile.yaml examples/pytorch-training/pytorch-mnist-gpu.yaml

  tofu:
    name: OpenTofu validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: fmt + validate
        working-directory: tofu
        run: |
          tofu fmt -check -recursive
          tofu init -backend=false -input=false
          tofu validate

  kfp-compile:
    name: KFP compile drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pinned KFP SDK
        run: pip install -r pipeline/requirements.txt

      - name: Compile all pipelines and check for drift
        run: |
          python pipeline/pipeline.py
          python examples/kubeflow-pipelines/hello_pipeline.py
          python examples/kubeflow-pipelines/gpu_pipeline.py
          if ! git diff --exit-code -- pipeline/pipeline.yaml examples/kubeflow-pipelines/*.yaml; then
            echo "::error::Compiled pipeline YAML is out of date. Run 'make compile' and commit the result."
            exit 1
          fi

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
